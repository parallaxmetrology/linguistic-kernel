name: Share a fingerprint or labeled outputs
description: Readings from a model or prompt set, ideally with labels
labels: [fingerprint]
body:
  - type: input
    id: model
    attributes:
      label: Model and version
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: Prompts and collection
      description: Where prompts came from, how many outputs, settings, any filtering.
    validations:
      required: true
  - type: textarea
    id: csv
    attributes:
      label: Readings (and labels, if any)
      description: Attach the CSV from `lk measure … -o out.csv`. Labels for truncated or broken outputs are especially useful.
    validations:
      required: true
